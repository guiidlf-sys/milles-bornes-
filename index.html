<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mille Bornes</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏁</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header class="app-header">
    <h1>🏁 Mille Bornes</h1>
    <button id="restart-btn" class="btn btn-ghost" hidden>Nouvelle partie</button>
  </header>

  <main id="setup-screen" class="screen">
    <div class="setup-card">
      <h2>Préparer la course</h2>
      <p class="muted">De 2 à 4 joueurs. Le premier à exactement 1000 bornes gagne !</p>

      <label class="field">
        <span>Nombre de joueurs</span>
        <select id="player-count">
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4" selected>4</option>
        </select>
      </label>

      <div id="seat-list" class="seat-list"></div>

      <button id="start-btn" class="btn btn-primary">Démarrer la course</button>
    </div>
  </main>

  <main id="game-screen" class="screen" hidden>
    <div id="opponents-row" class="opponents-row"></div>

    <div class="table-row">
      <div class="pile-area">
        <div class="pile-stack">
          <div class="pile-label">Pioche</div>
          <button id="deck-pile" class="card card-back" title="Piocher"></button>
          <div id="deck-count" class="pile-count">0</div>
        </div>
        <div class="pile-stack">
          <div class="pile-label">Défausse</div>
          <div id="discard-pile" class="card card-empty"></div>
          <div id="discard-count" class="pile-count">0</div>
        </div>
      </div>
      <div id="log-panel" class="log-panel" aria-live="polite"></div>
    </div>

    <section id="active-panel" class="active-panel">
      <div id="active-tableau" class="tableau"></div>
      <div id="action-hint" class="action-hint"></div>
      <div id="hand-row" class="hand-row"></div>
      <div id="controls-row" class="controls-row">
        <button id="draw-btn" class="btn btn-primary">Piocher</button>
        <button id="discard-btn" class="btn btn-secondary" disabled>Défausser la carte sélectionnée</button>
      </div>
    </section>
  </main>

  <div id="modal-root"></div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
